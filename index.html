<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo Drift - 3D Racing</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="hud">
    <div class="top-bar">
      <div class="score-box">
        <span class="label">SCORE</span>
        <span id="score">0</span>
      </div>
      <div class="speed-box">
        <span id="speed">0</span>
        <span class="unit">KM/H</span>
      </div>
      <div class="score-box">
        <span class="label">BEST</span>
        <span id="highScore">0</span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="health-box">
        <span class="label">ARMOR</span>
        <div id="health-bars">
          <div class="h-bar"></div><div class="h-bar"></div><div class="h-bar"></div>
        </div>
      </div>

      <div class="nitro-box">
        <span class="label">NITRO</span>
        <div id="nitro-track"><div id="nitro-fill"></div></div>
      </div>
    </div>

    <div id="message">Press <kbd>SPACE</kbd> to start &nbsp;|&nbsp; <kbd>Shift</kbd> Nitro</div>
    <button id="startBtn">START RACE</button>
  </div>

  <div id="gameOver" class="hidden">
    <div class="go-content">
      <h2>CRASHED!</h2>
      <p class="final-score">Score: <span id="finalScore">0</span></p>
      <p class="tip">Tip: Use nitro (Shift) to escape tight spots</p>
      <button id="restartBtn">RACE AGAIN</button>
    </div>
  </div>

  <div id="pauseMenu" class="hidden">
    <div class="go-content">
      <h2>PAUSED</h2>
      <button id="resumeBtn">RESUME</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
